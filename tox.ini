# ---------------------------------------------------------------------------
# SUNDIALS_INST is passed in:
#   macOS  → /opt/homebrew
#   Linux  → /usr
# ---------------------------------------------------------------------------

[tox]
minversion = 4.0.0
envlist = py310, py311, py312, py313, py314, lint, doccheck, coverage, mypy, black
isolated_build = true

[gh-actions]
python =
    3.10: py310
    3.11: py311
    3.12: py312
    3.13: py313
    3.14: py314

[testenv]
description = Run unit tests
deps =
    pytest
passenv =
    SUNDIALS_INST
    HOME
    # macOS dynamic-linker
    DYLD_LIBRARY_PATH
    # Linux dynamic-linker
    LD_LIBRARY_PATH
    CPPFLAGS
    LDFLAGS
    PATH
    FC
install_command = pip install --no-cache-dir --no-binary scikits-odes-sundials {opts} {packages}
setenv =
    PYTHONPATH = {toxinidir}
    HOME = {env:HOME}\
    SUNDIALS_INST = {env:SUNDIALS_INST:/usr}
    CPPFLAGS  = {env:CPPFLAGS:-I{env:SUNDIALS_INST:/usr}/include}
    LDFLAGS   = {env:LDFLAGS:-L{env:SUNDIALS_INST:/usr}/lib -L{env:SUNDIALS_INST:/usr}/lib/x86_64-linux-gnu}
    DYLD_LIBRARY_PATH = {env:SUNDIALS_INST:/usr}/lib
    LD_LIBRARY_PATH   = {env:SUNDIALS_INST:/usr}/lib:{env:SUNDIALS_INST:/usr}/lib/x86_64-linux-gnu
    FC = {env:FC:gfortran}
allowlist_externals =
    bash
    gfortran
commands =
    pytest tests/

[testenv:lint]
description = Run Ruff linter on code and docstrings
deps = ruff
commands =
    ruff check src/

[testenv:doccheck]
description = Check Python docstring coverage with interrogate
deps = interrogate
commands =
    interrogate src/ --fail-under=90 --verbose

[testenv:coverage]
description = Run tests with coverage
deps =
    pytest
    pytest-cov
passenv =
    SUNDIALS_INST
    HOME
    # macOS dynamic-linker
    DYLD_LIBRARY_PATH
    # Linux dynamic-linker
    LD_LIBRARY_PATH
    CPPFLAGS
    LDFLAGS
    PATH
    FC
install_command = pip install --no-cache-dir --no-binary scikits-odes-sundials {opts} {packages}
setenv =
    PYTHONPATH = {toxinidir}
    HOME = {env:HOME}\
    SUNDIALS_INST = {env:SUNDIALS_INST:/usr}
    CPPFLAGS  = {env:CPPFLAGS:-I{env:SUNDIALS_INST:/usr}/include}
    LDFLAGS   = {env:LDFLAGS:-L{env:SUNDIALS_INST:/usr}/lib -L{env:SUNDIALS_INST:/usr}/lib/x86_64-linux-gnu}
    DYLD_LIBRARY_PATH = {env:SUNDIALS_INST:/usr}/lib
    LD_LIBRARY_PATH   = {env:SUNDIALS_INST:/usr}/lib:{env:SUNDIALS_INST:/usr}/lib/x86_64-linux-gnu
    FC = {env:FC:gfortran}
allowlist_externals =
    bash
    gfortran
commands =
    coverage run --source=reactormodels -m pytest tests/
    coverage report --fail-under=80
    coverage html

[testenv:mypy]
description = Run mypy type checks
deps =
    mypy
    scipy-stubs
commands =
    mypy src/

[testenv:black]
description = Check code formatting with black
deps = black
commands =
    black --check --target-version py310 src/