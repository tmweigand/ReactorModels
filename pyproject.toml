[project]
name = "reactormodels"
version = "0.1.0"
description = "Collection of models for simulating transport in fixed bed reactors"
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "numpy<2.0",
    "scipy>=1.13",
    "scikits.odes",
    "matplotlib",
    "openpyxl",
]


[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["reactormodels*"]


[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=2.0",
    "mypy>=1.15",
    "tox>=4",
    "pytest_benchmark>=5.1.0",
    "ruff>=0.11.5",
    "interrogate>=1.5.0",
]

docs = [
    "sphinx>=7.0",
    "sphinx_rtd_theme",
    "myst-parser",
    "sphinxcontrib-bibtex",
    "typing_extensions"
]

[tool.black]
line-length = 88
target-version = ["py311"]


[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src"]
exclude = [
    "src/pmmoto/io/evtk",
]

[tool.ruff.lint]
select = ["E", "F", "D"]  # E = pycodestyle, F = pyflakes, D = pydocstyle
ignore = ["D107", "D203", "D213", "D400", "D415", "D200"]

[tool.interrogate]
fail-under = 90
ignore-init-method = true
ignore-module = true

[tool.mypy]
exclude = ['examples/', 'tests/']
ignore_missing_imports = true

[tool.cibuildwheel]
build-verbosity = 1