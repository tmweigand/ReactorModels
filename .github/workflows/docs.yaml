name: Build and Deploy Sphinx Docs

on:
  push:
    branches:
      - main
    paths:
      - "docs/**"
      - "src/**"
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [macos-latest]
        python-version: ["3.11"]


    steps:
      - uses: actions/checkout@v2
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install SUNDIALS and Fortran Compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc sundials librsvg
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

          GFORTRAN_BIN="$(find "$(brew --prefix gcc)/bin" -name 'gfortran-*' | head -n 1)"
          ln -sf "$GFORTRAN_BIN" /opt/homebrew/bin/gfortran

          which gfortran
          gfortran --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs]

      - name: Build docs
        run: |
          rm -rf docs/api docs/_build
          sphinx-apidoc -o docs/api src/reactormodels --force --module-first
          cd docs
          make html

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html