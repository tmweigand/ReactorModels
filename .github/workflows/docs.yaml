name: Build and Deploy Sphinx Docs

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ${{ matrix.os }}
    env:
      SUNDIALS_INST: /opt/homebrew
    strategy:
      matrix:
        os: [macos-latest]
        python-version: ["3.11"]


    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install LaTeX
        run: |
            brew install --cask mactex-no-gui
            echo "/Library/TeX/texbin" >> $GITHUB_PATH

      - name: Install SUNDIALS and Fortran Compiler (macOS)
        if: runner.os == 'macOS'
        run: |
          brew install gcc sundials librsvg
          echo "/opt/homebrew/bin" >> $GITHUB_PATH

          GFORTRAN_BIN="$(find "$(brew --prefix gcc)/bin" -name 'gfortran-*' | head -n 1)"
          ln -sf "$GFORTRAN_BIN" /opt/homebrew/bin/gfortran

          which gfortran
          gfortran --version

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[docs,dev]

      - name: Restore ASV history
        run: |
          rm -rf "$RUNNER_TEMP/asv-results"

          if git ls-remote --exit-code --heads origin asv-results >/dev/null 2>&1; then
            git fetch origin asv-results:asv-results
            git worktree add "$RUNNER_TEMP/asv-results" asv-results
            if [ -d "$RUNNER_TEMP/asv-results/.asv/results" ]; then
              rm -rf .asv
              mkdir -p .asv
              cp -R "$RUNNER_TEMP/asv-results/.asv/results" .asv/
              cp -R "$RUNNER_TEMP/asv-results/.asv/html" .asv/
            fi
          else
            git worktree add "$RUNNER_TEMP/asv-results" --detach
            git -C "$RUNNER_TEMP/asv-results" switch --orphan asv-results
            git -C "$RUNNER_TEMP/asv-results" rm -rf . >/dev/null 2>&1 || true
          fi

      - name: Run ASV benchmarks
        run: |
          asv machine --machine github-actions-macos --yes
          asv run HEAD^!
          asv publish

      - name: Build docs
        run: |
          rm -rf docs/api docs/_build
          sphinx-apidoc -o docs/api src/reactormodels --force --module-first
          cd docs
          make html

      - name: Copy ASV results into built docs
        run: |
          mkdir -p docs/_build/html/asv
          cp -R .asv/html/. docs/_build/html/asv/

      - name: Update ASV history branch
        run: |
          rm -rf "$RUNNER_TEMP/asv-results/.asv"
          mkdir -p "$RUNNER_TEMP/asv-results/.asv"
          cp -R .asv/results "$RUNNER_TEMP/asv-results/.asv/"
          cp -R .asv/html "$RUNNER_TEMP/asv-results/.asv/"

          git -C "$RUNNER_TEMP/asv-results" add .asv
          if git -C "$RUNNER_TEMP/asv-results" diff --cached --quiet; then
            exit 0
          fi

          git -C "$RUNNER_TEMP/asv-results" \
            -c user.name="github-actions[bot]" \
            -c user.email="github-actions[bot]@users.noreply.github.com" \
            commit -m "Update ASV results for ${GITHUB_SHA}"

          git -C "$RUNNER_TEMP/asv-results" push -u origin asv-results

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs/_build/html